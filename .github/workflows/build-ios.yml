name: Build VLCKit for iOS

# Builds VLCKit for iOS devices (arm64) from this fork — VideoLAN's 4.0.0-a25
# plus our libvlc patches (libvlc/patches/0013+) — and publishes it as a
# GitHub release that Package.swift points at. MoviePoop's iOS app depends on
# this package by version.
#
# Run it from the Actions tab with a new version, e.g. 4.0.0-a25-mp.2. libvlc
# and all of its contribs (FFmpeg etc.) compile from source, so a run takes
# a couple of hours.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (semver, e.g. 4.0.0-a25-mp.1)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest  # same image as the MoviePoop iOS build
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # VLC's extras/tools builds the other tools it wants (as VideoLAN's own
      # CI does). The one thing it needs from outside is a modern GNU make:
      # macOS ships make 3.81, whose pipe jobserver hands ninja closed file
      # descriptors ("ninja: error: Could not initialize jobserver"). make 4.4
      # uses a fifo jobserver. Only its gnubin directory goes on the build's
      # PATH (via VLC_PATH) — Homebrew's own ninja broke the build the same way.
      - name: GNU make 4.4
        run: brew install make

      - name: Build VLCKit (iOS device, arm64, release)
        env:
          VLC_PATH: /opt/homebrew/opt/make/libexec/gnubin
        run: ./compileAndBuildVLCKit.sh -f -r -a aarch64

      - name: Package
        id: pkg
        run: |
          cd build/iOS
          ditto -c -k --sequesterRsrc --keepParent VLCKit.xcframework "$GITHUB_WORKSPACE/VLCKit-ios.zip"
          cd "$GITHUB_WORKSPACE"
          echo "checksum=$(swift package compute-checksum VLCKit-ios.zip)" >> "$GITHUB_OUTPUT"
          ls -lh VLCKit-ios.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHECKSUM: ${{ steps.pkg.outputs.checksum }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/VLCKit-ios.zip"
          sed -i '' -E "s#url: \".*\"#url: \"${url}\"#; s#checksum: \".*\"#checksum: \"${CHECKSUM}\"#" Package.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Package: VLCKit ${VERSION} (iOS)"
          git tag "${VERSION}"
          git push origin HEAD "${VERSION}"
          gh release create "${VERSION}" VLCKit-ios.zip --verify-tag \
            --title "VLCKit ${VERSION} (iOS)" \
            --notes "VLCKit 4.0.0-a25 + patches in libvlc/patches. iOS device (arm64) only. SwiftPM checksum: ${CHECKSUM}"
